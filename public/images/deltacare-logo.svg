  </g>
  <!-- Wordmark -->
  <text x="58" y="36" font-family="Georgia, 'Source Serif 4', serif" font-size="27" font-weight="700" fill="#080808" letter-spacing="-0.4">Delta<tspan fill="#0057b8">Care</tspan></text>
</svg>

