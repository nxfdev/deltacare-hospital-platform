<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 56" width="200" height="56" role="img" aria-label="DeltaCare">
  <defs>
    <linearGradient id="dcShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0057b8" />
      <stop offset="100%" stop-color="#002443" />
    </linearGradient>
  </defs>
  <!-- Triple-interlocking clinical shield inspired by architectural medical heraldry, original DeltaCare geometry -->
  <g transform="translate(4, 4)">
    <path d="M24 2 L42 9 V23 C42 35 34.2 43.2 24 47 C13.8 43.2 6 35 6 23 V9 L24 2 Z" fill="none" stroke="#0057b8" stroke-width="2.4"/>
    <path d="M24 7 L37 12.2 V22.5 C37 31.8 31.2 38.4 24 41.5 C16.8 38.4 11 31.8 11 22.5 V12.2 L24 7 Z" fill="url(#dcShield)"/>
    <!-- Delta + Medical Cross inside shield -->
